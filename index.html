<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ecdcbf">
<title>Trognons &amp; Donjons (prototype)</title>
<style>
  @font-face{font-family:'Fredoka';src:url(fonts/fredoka-700.woff2) format('woff2');font-weight:300 700;font-display:swap}
  html,body{margin:0;height:100%;background:#d9bd8f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:#4a3324}
  canvas{display:block;position:absolute;left:0;top:0}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(58,36,24,.25),rgba(58,36,24,.6));z-index:5}
  #ov.hide{display:none}
  .card{position:relative;background:linear-gradient(#fff8ea,#f6e6c8);border:2px solid #c9a676;border-radius:24px;padding:22px 20px 20px;width:min(300px,80vw);text-align:center;box-shadow:0 6px 0 #b8925f,0 14px 30px rgba(58,36,24,.35)}
  .card:before{content:"";position:absolute;inset:5px;border:1.5px dashed rgba(201,166,118,.6);border-radius:19px;pointer-events:none}
  .card.title{margin-top:56vh;padding-top:16px}
  #ov.titleov{background:linear-gradient(rgba(58,36,24,.1),rgba(58,36,24,.5))}
  .card h2{margin:0 0 8px;font-size:24px;font-weight:700;color:#e2774a;text-shadow:0 2px 0 #fff}
  .card p{margin:7px 0;font-size:15px;line-height:1.35;font-weight:500}
  .card .small{font-size:12.5px;opacity:.75}
  .logo{position:fixed;left:50%;top:max(14px,4vh);transform:translateX(-50%) rotate(-3deg);width:max-content;line-height:.92;font-weight:700}
  .logo span{display:block;color:#ffcf6a;-webkit-text-stroke:2px #5a2e18;paint-order:stroke fill;text-shadow:0 4px 0 #5a2e18,0 8px 18px rgba(40,20,10,.45)}
  .logo .l1{font-size:50px;color:#ff9a4a}
  .logo .amp{font-size:30px;color:#97d775;margin:-2px 0}
  .logo .l2{font-size:54px;color:#ffcf6a}
  .card button{position:relative;display:block;width:100%;margin:12px 0 0;padding:13px;border:2px solid #9a4a26;border-radius:16px;font:inherit;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(#f39a62,#e2774a);box-shadow:0 4px 0 #9a4a26;text-shadow:0 1px 0 rgba(90,40,20,.5)}
  .card button.alt{background:linear-gradient(#9cc985,#7fae6a);border-color:#4f7f3e;box-shadow:0 4px 0 #4f7f3e}
  .card button:active{transform:translateY(3px);box-shadow:0 1px 0 #9a4a26}
  .loot{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;font-size:18px;font-weight:700}
  .loot span{display:flex;align-items:center;gap:5px}
  .ic{display:inline-block;width:12px;height:12px;border:1.5px solid #3a2622}
  .ic.fibre{background:#7cbf5a;border-radius:0 80% 0 80%}
  .ic.eclat{background:#ffc93d;transform:rotate(45deg) scale(.85);border-color:#8a5a1a}
  .ic.oeuf{background:#fff6e6;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;width:11px;height:14px}
  .ic.trognon{background:#a77de0;border-radius:50% 50% 40% 40%;border-color:#3d2350}
  .card.panel{max-height:84vh;overflow:auto}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:rgba(255,255,255,.55);border:1.5px solid #e2c99c;border-radius:14px;padding:9px 10px;margin:8px 0}
  .card button.mini{width:auto;margin:0;padding:8px 12px;font-size:14px;border-radius:12px}
  .card button.mini.wide{width:100%;margin-top:10px}
  .card button:disabled{filter:grayscale(.8);opacity:.55}
  .timer{font-size:20px;font-weight:700;color:#e2774a}.timer.big{font-size:34px;margin:6px 0}
  .bar{height:12px;border-radius:8px;background:#ead7b8;border:1.5px solid #c9a676;overflow:hidden;margin:8px 0 2px}.bar i{display:block;height:100%;background:linear-gradient(#ffb36b,#e2774a)}
  .picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
  .card button.pick{width:auto;margin:0;padding:8px 10px;font-size:14px;background:#fff8ea;color:#4a3324;border-color:#c9a676;box-shadow:0 3px 0 #c9a676;text-shadow:none}
  .card button.pick.on{background:linear-gradient(#9cc985,#7fae6a);color:#fff;border-color:#4f7f3e;box-shadow:0 3px 0 #4f7f3e}
  .pick small{display:block;font-size:11px;font-weight:500;opacity:.8}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.tag{background:#fff8ea;border:1.5px solid #c9a676;border-radius:10px;padding:4px 8px;font-size:13px;font-weight:600}.tag.off{opacity:.45}
  .petico{display:flex;justify-content:center;margin:-6px 0 -4px}.petico canvas{position:static;width:180px;height:150px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="card" id="card"></div></div>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/refuge.js"></script>
</body>
</html>
