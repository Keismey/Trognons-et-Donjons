<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6d0">
<title>Trognons &amp; Donjons (prototype)</title>
<style>
  html,body{margin:0;height:100%;background:#f3e6d0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:"Trebuchet MS",system-ui,sans-serif;color:#4a3b2c}
  canvas{display:block;position:absolute;left:0;top:0}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(74,59,44,.55);z-index:5}
  #ov.hide{display:none}
  .card{background:#fff8ec;border-radius:22px;padding:22px 20px;width:min(300px,82vw);text-align:center;box-shadow:0 8px 0 #d9c19c}
  .card h1{margin:0 0 6px;font-size:28px;color:#e2774a;line-height:1.05}
  .card h2{margin:0 0 10px;font-size:22px;color:#e2774a}
  .card p{margin:6px 0;font-size:15px;line-height:1.35}
  .card .small{font-size:12.5px;opacity:.75}
  .card button{display:block;width:100%;margin:10px 0 0;padding:13px;border:0;border-radius:14px;font:inherit;font-size:17px;font-weight:bold;color:#fff;background:#e2774a;box-shadow:0 4px 0 #b55a35}
  .card button.alt{background:#7fae6a;box-shadow:0 4px 0 #5a8a48}
  .card button:active{transform:translateY(3px);box-shadow:0 1px 0 #b55a35}
  .loot{display:flex;justify-content:center;gap:14px;margin:10px 0;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="card" id="card"></div></div>
<script>
'use strict';
/* =====================================================================
   Trognons & Donjons — prototype du donjon (formes simples, pas d'images)
   Écran logique 360 x 640 en portrait, mis à l'échelle.
   ===================================================================== */
const W=360,H=640,T=32,COLS=11,ROWS=11,OX=4,OY=64,CTRL_Y=OY+ROWS*T+6;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let scale=1,offX=0,offY=0;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const vw=innerWidth,vh=innerHeight;
  scale=Math.min(vw/W,vh/H);offX=(vw-W*scale)/2;offY=(vh-H*scale)/2;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);cv.style.width=vw+'px';cv.style.height=vh+'px';
  cx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}
addEventListener('resize',resize);resize();

/* ---------- petits outils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, len=(x,y)=>Math.hypot(x,y);
function norm(x,y){const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}}

/* ---------- sauvegarde ---------- */
const SAVE_KEY='trognons-et-donjons-proto';
let save={fibres:0,eclats:0,oeufs:0,trognons:[],record:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ---------- sons (fabriqués par le jeu) ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,type='square',vol=.08,slide=0,delay=0){
  if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,vol=.1,freq=1200){
  if(!ac)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;
  s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start();
}
const SFX={
  swing:()=>noise(.09,.07,2600),
  hit:()=>{tone(220,.08,'square',.07,-120);noise(.06,.08,900)},
  hurt:()=>{tone(300,.25,'sawtooth',.08,-220)},
  pick:()=>tone(880,.07,'triangle',.07,300),
  coin:()=>{tone(988,.06,'triangle',.06);tone(1319,.1,'triangle',.06,0,.06)},
  roll:()=>noise(.12,.05,700),
  fire:()=>{tone(180,.25,'sawtooth',.06,260);noise(.2,.05,1800)},
  stun:()=>{tone(660,.1,'sine',.08);tone(520,.1,'sine',.08,0,.1);tone(660,.15,'sine',.08,0,.2)},
  capture:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.08,0,i*.08))},
  door:()=>tone(330,.12,'triangle',.06,120),
  clear:()=>{[392,523,659].forEach((f,i)=>tone(f,.18,'triangle',.07,0,i*.09))},
  egg:()=>{[659,784,988,1319].forEach((f,i)=>tone(f,.2,'sine',.08,0,i*.1))},
  shoot:()=>tone(500,.08,'square',.04,-200),
  ko:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.15))},
};

/* ---------- entrées : clavier + écran tactile ---------- */
const keys={};
const input={mx:0,my:0,atk:false,roll:false,pow:false};
addEventListener('keydown',e=>{keys[e.code]=true;audio();
  if(e.code==='KeyJ'||e.code==='Space')input.atk=true;
  if(e.code==='KeyK'||e.code==='ShiftLeft')input.roll=true;
  if(e.code==='KeyL')input.pow=true;});
addEventListener('keyup',e=>{keys[e.code]=false});
const BTN={atk:{x:296,y:CTRL_Y+92,r:40,label:'⚔'},roll:{x:216,y:CTRL_Y+150,r:28,label:'↻'},pow:{x:214,y:CTRL_Y+52,r:28,label:'✦'}};
const joy={id:null,bx:0,by:0,x:0,y:0};
const pressed={};
function toLogical(e){return{x:(e.clientX-offX)/scale,y:(e.clientY-offY)/scale}}
cv.addEventListener('pointerdown',e=>{
  audio();const p=toLogical(e);cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  for(const k in BTN){const b=BTN[k];if(len(p.x-b.x,p.y-b.y)<b.r+12){input[k]=true;pressed[e.pointerId]=k;return}}
  if(p.x<180&&p.y>OY){joy.id=e.pointerId;joy.bx=p.x;joy.by=Math.max(p.y,CTRL_Y+40);joy.x=p.x;joy.y=p.y}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){const p=toLogical(e);joy.x=p.x;joy.y=p.y}});
function up(e){if(e.pointerId===joy.id)joy.id=null;delete pressed[e.pointerId]}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function readMove(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft||keys.KeyQ)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;
  if(keys.KeyW||keys.ArrowUp||keys.KeyZ)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
  if(joy.id!==null){const dx=joy.x-joy.bx,dy=joy.y-joy.by,l=len(dx,dy);if(l>6){const m=Math.min(1,l/40);x=dx/l*m;y=dy/l*m}}
  const l=len(x,y);if(l>1){x/=l;y/=l}
  input.mx=x;input.my=y;
}

/* ---------- les espèces (futurs trognons) ---------- */
const SPECIES={
  glouton:{nom:'Glouton',hp:3,r:11,col:'#b48ce0',dark:'#7f5aa8'},
  epineux:{nom:'Épineux',hp:2,r:11,col:'#7fbf6a',dark:'#4f8a3e'},
  bourdon:{nom:'Bourdon',hp:2,r:9,col:'#ffcf4d',dark:'#c99417'},
};

/* ---------- génération d'un étage ---------- */
const TEMPLATES=[
  [],
  [[2,2],[2,8],[8,2],[8,8]],
  [[3,3],[3,4],[4,3],[3,7],[3,6],[4,7],[7,3],[6,3],[7,4],[7,7],[7,6],[6,7]],
  [[3,2],[3,3],[3,4],[3,6],[3,7],[3,8],[7,2],[7,3],[7,4],[7,6],[7,7],[7,8]],
  [[2,4],[4,8],[6,2],[8,6],[3,6],[7,3]],
  [[2,2],[2,3],[3,2],[2,8],[2,7],[3,8],[8,2],[8,3],[7,2],[8,8],[8,7],[7,8]],
];
const DIRS={n:[0,-1],s:[0,1],w:[-1,0],e:[1,0]},OPP={n:'s',s:'n',w:'e',e:'w'};
let floorN=1,rooms={},cur=null,run=null;

function genFloor(){
  rooms={};const key=(x,y)=>x+','+y;
  const want=6+Math.min(4,floorN);
  const list=[[2,2]];rooms[key(2,2)]={gx:2,gy:2};
  let guard=0;
  while(list.length<want&&guard++<500){
    const [x,y]=pick(list),d=pick(Object.values(DIRS)),nx=x+d[0],ny=y+d[1];
    if(nx<0||ny<0||nx>4||ny>4||rooms[key(nx,ny)])continue;
    // évite les gros paquets : max 2 voisins déjà présents
    let nb=0;for(const dd of Object.values(DIRS))if(rooms[key(nx+dd[0],ny+dd[1])])nb++;
    if(nb>1&&Math.random()<.7)continue;
    rooms[key(nx,ny)]={gx:nx,gy:ny};list.push([nx,ny]);
  }
  // distances depuis le départ : la plus lointaine = sortie
  const dist={};dist[key(2,2)]=0;const q=[[2,2]];
  while(q.length){const [x,y]=q.shift();for(const d of Object.values(DIRS)){const k=key(x+d[0],y+d[1]);if(rooms[k]&&dist[k]===undefined){dist[k]=dist[key(x,y)]+1;q.push([x+d[0],y+d[1]])}}}
  let far=key(2,2);for(const k in dist)if(dist[k]>dist[far])far=k;
  const others=Object.keys(rooms).filter(k=>k!==far&&k!==key(2,2));
  const eggRoom=Math.random()<.6?pick(others):null;
  const chestRooms=new Set(others.filter(k=>k!==eggRoom&&Math.random()<.3));
  for(const k in rooms){
    const r=rooms[k];r.key=k;r.seen=false;r.cleared=false;r.start=k===key(2,2);r.exit=k===far;
    r.egg=k===eggRoom;r.chest=chestRooms.has(k);r.doors={};
    for(const n in DIRS){const d=DIRS[n];if(rooms[key(r.gx+d[0],r.gy+d[1])])r.doors[n]=key(r.gx+d[0],r.gy+d[1])}
    r.grid=[];for(let y=0;y<ROWS;y++){r.grid.push([]);for(let x=0;x<COLS;x++)r.grid[y].push(x===0||y===0||x===COLS-1||y===ROWS-1?1:0)}
    if(!r.start&&!r.exit){for(const [cy,cxx] of pick(TEMPLATES))r.grid[cy][cxx]=2}
    r.flowers=[];for(let i=0;i<9;i++)r.flowers.push([ri(1,9),ri(1,9),Math.random()]);
    r.enemies=null;r.loot=[];
  }
  return rooms[key(2,2)];
}

/* ---------- entités ---------- */
let hero,buddy,shots=[],parts=[],floats=[],shake=0,fade=0,banner=null,msg=null;
function newHero(){return{x:5.5*T,y:5.5*T,r:10,fx:0,fy:1,hp:6,max:6,inv:0,atk:0,atkDone:false,roll:0,rollCd:0,vx:0,vy:0,walk:0,kx:0,ky:0}}
function newBuddy(){return{x:hero.x,y:hero.y+20,cd:0,bob:0,squash:0,name:'Braisou'}}

function spawnEnemies(r){
  r.enemies=[];if(r.start)return;
  const n=r.exit?2+Math.min(3,floorN):ri(2,3)+Math.min(2,floorN-1);
  let auraLeft=Math.random()<.55?1:0;
  const types=floorN===1?['glouton','glouton','epineux','bourdon']:['glouton','epineux','bourdon','bourdon'];
  for(let i=0;i<n;i++){
    let tx,ty,g=0;
    do{tx=ri(1,9);ty=ri(1,9);g++}while(g<200&&(r.grid[ty][tx]!==0||len((tx+.5)*T-hero.x,(ty+.5)*T-hero.y)<3.2*T));
    const t=pick(types),s=SPECIES[t];
    const e={t,x:(tx+.5)*T,y:(ty+.5)*T,r:s.r,hp:s.hp+(floorN>2?1:0),max:s.hp+(floorN>2?1:0),vx:0,vy:0,st:'idle',tm:rnd(.3,1.2),flash:0,
      aura:false,stun:false,stunT:0,dead:false,ph:Math.random()*6,sq:0,kx:0,ky:0,dx:0,dy:0};
    if(auraLeft>0){e.aura=true;auraLeft--}
    r.enemies.push(e);
  }
}

/* ---------- collisions ---------- */
function solidAt(tx,ty,forHero){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return!forHero;
  const v=cur.grid[ty][tx];if(v===0)return false;
  if(v===1&&forHero&&cur.cleared){ // portes ouvertes
    if(tx===5&&ty===0&&cur.doors.n)return false;if(tx===5&&ty===ROWS-1&&cur.doors.s)return false;
    if(ty===5&&tx===0&&cur.doors.w)return false;if(ty===5&&tx===COLS-1&&cur.doors.e)return false;
  }
  return true;
}
function hits(x,y,r,forHero){
  const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(tx,ty,forHero))continue;
    const nx=clamp(x,tx*T,tx*T+T),ny=clamp(y,ty*T,ty*T+T);if(len(x-nx,y-ny)<r)return true;
  }
  return false;
}
function moveBody(b,dx,dy,forHero){
  let bx=false,by=false;
  if(!hits(b.x+dx,b.y,b.r,forHero))b.x+=dx;else bx=true;
  if(!hits(b.x,b.y+dy,b.r,forHero))b.y+=dy;else by=true;
  return{bx,by};
}

/* ---------- effets ---------- */
function burst(x,y,col,n=8,sp=90,life=.45){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(sp*.4,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col,r:rnd(1.5,3.5)})}}
function floatText(x,y,txt,col='#4a3b2c'){floats.push({x,y,txt,col,t:0})}
function say(t,d=2.2){msg={t,d}}

/* ---------- butin ---------- */
function drop(x,y,kind,n=1){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(40,90);cur.loot.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,kind,t:0})}}
function collect(l){
  if(l.kind==='fibre'){run.fibres++;SFX.pick()}
  else if(l.kind==='eclat'){run.eclats++;SFX.coin()}
  else if(l.kind==='coeur'){hero.hp=Math.min(hero.max,hero.hp+2);SFX.pick();floatText(hero.x,hero.y-18,'+1 ♥','#e2574a')}
  else if(l.kind==='oeuf'){run.oeufs++;SFX.egg();say('Un œuf ! Il éclora au refuge.');burst(l.x,l.y,'#fff3c4',16,120)}
}

/* ---------- une descente ---------- */
function startRun(keepFloor){
  if(!keepFloor){floorN=1;run={fibres:0,eclats:0,oeufs:0,trognons:[]}}
  hero=hero&&keepFloor?Object.assign(hero,{x:5.5*T,y:5.5*T,inv:0,atk:0,roll:0}):newHero();
  buddy=newBuddy();
  cur=genFloor();shots=[];parts=[];floats=[];
  enterRoom(cur,null);
  banner={t:'Les Racines · étage '+floorN,d:2};
  state='play';hideOv();
}
function enterRoom(r,from){
  cur=r;shots=[];r.seen=true;
  if(from){ // place le héros devant la porte d'arrivée
    const d=OPP[from];
    if(d==='n'){hero.x=5.5*T;hero.y=1.5*T}if(d==='s'){hero.x=5.5*T;hero.y=(ROWS-1.5)*T}
    if(d==='w'){hero.x=1.5*T;hero.y=5.5*T}if(d==='e'){hero.x=(COLS-1.5)*T;hero.y=5.5*T}
  }
  buddy.x=hero.x;buddy.y=hero.y;
  if(!r.enemies)spawnEnemies(r);
  if(r.enemies.filter(e=>!e.dead&&!e.stun).length===0&&!r.cleared){r.cleared=true;onClear(r,true)}
  fade=.25;
}
function onClear(r,silent){
  if(!silent){SFX.clear();if(r.chest)say('Un coffre est apparu !');}
  if(r.chest&&!r.chestObj)r.chestObj={x:5.5*T,y:5.5*T,open:false};
  if(r.egg&&!r.eggTaken){r.loot.push({x:5.5*T,y:4.5*T,vx:0,vy:0,kind:'oeuf',t:0,still:true});r.eggTaken=true}
  if(r.exit)r.portal={x:5.5*T,y:5.5*T,t:0};
}

/* ---------- mise à jour ---------- */
let state='title',last=performance.now();
function update(dt){
  readMove();
  if(state!=='play'){input.atk=input.roll=input.pow=false;return}
  const h=hero;
  h.inv=Math.max(0,h.inv-dt);h.rollCd=Math.max(0,h.rollCd-dt);buddy.cd=Math.max(0,buddy.cd-dt);
  if(banner){banner.d-=dt;if(banner.d<=0)banner=null}
  if(msg){msg.d-=dt;if(msg.d<=0)msg=null}
  fade=Math.max(0,fade-dt);shake=Math.max(0,shake-dt*30);

  // créature assommée à portée ?
  const near=cur.enemies.find(e=>e.stun&&!e.dead&&len(e.x-h.x,e.y-h.y)<34);
  BTN.atk.label=near?'♥':'⚔';

  // actions
  if(input.atk){
    if(near){capture(near)}
    else if(h.atk<=0&&h.roll<=0){h.atk=.24;h.atkDone=false;SFX.swing()}
  }
  if(input.roll&&h.roll<=0&&h.rollCd<=0&&h.atk<=0){
    const d=(input.mx||input.my)?norm(input.mx,input.my):{x:h.fx,y:h.fy};
    h.fx=d.x;h.fy=d.y;h.roll=.26;h.rollCd=.75;SFX.roll();burst(h.x,h.y+6,'#d8c3a0',6,50,.3);
  }
  if(input.pow&&buddy.cd<=0){
    buddy.cd=3.5;buddy.squash=1;SFX.fire();
    shots.push({x:buddy.x,y:buddy.y,vx:h.fx*230,vy:h.fy*230,r:7,friend:true,dmg:2,life:1.4});
  }
  input.atk=input.roll=input.pow=false;

  // déplacement
  let mvx=0,mvy=0;
  if(h.roll>0){h.roll-=dt;mvx=h.fx*250;mvy=h.fy*250}
  else{
    const sp=h.atk>0?55:118;mvx=input.mx*sp;mvy=input.my*sp;
    if(input.mx||input.my){const d=norm(input.mx,input.my);if(h.atk<=0){h.fx=d.x;h.fy=d.y}h.walk+=dt*10}
  }
  h.kx*=Math.pow(.001,dt);h.ky*=Math.pow(.001,dt);
  moveBody(h,(mvx+h.kx)*dt,(mvy+h.ky)*dt,true);

  // attaque à l'épée
  if(h.atk>0){
    h.atk-=dt;
    if(!h.atkDone&&h.atk<.18){h.atkDone=true;
      const px=h.x+h.fx*16,py=h.y+h.fy*16;
      for(const e of cur.enemies){if(e.dead||e.stun)continue;if(len(e.x-px,e.y-py)<e.r+20)damage(e,1,h.fx,h.fy)}
    }
  }

  // sortie de salle par une porte
  if(cur.cleared){
    let dir=null;
    if(h.y<10&&cur.doors.n)dir='n';else if(h.y>ROWS*T-10&&cur.doors.s)dir='s';
    else if(h.x<10&&cur.doors.w)dir='w';else if(h.x>COLS*T-10&&cur.doors.e)dir='e';
    if(dir){SFX.door();enterRoom(rooms[cur.doors[dir]],dir);return}
  }

  // compagnon
  const tx=h.x-h.fx*22,ty=h.y-h.fy*22;buddy.x+=(tx-buddy.x)*Math.min(1,dt*6);buddy.y+=(ty-buddy.y)*Math.min(1,dt*6);
  buddy.bob+=dt*6;buddy.squash=Math.max(0,buddy.squash-dt*4);

  // ennemis
  for(const e of cur.enemies){if(!e.dead)updEnemy(e,dt)}
  if(!cur.cleared&&cur.enemies.every(e=>e.dead||e.stun)){cur.cleared=true;onClear(cur,false)}

  // tirs
  for(const s of shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(hits(s.x,s.y,3,false)){s.life=0;burst(s.x,s.y,s.friend?'#ff9f5a':'#9bd27f',5,60,.3)}
    if(s.friend){for(const e of cur.enemies){if(!e.dead&&!e.stun&&len(e.x-s.x,e.y-s.y)<e.r+s.r){damage(e,s.dmg,norm(s.vx,s.vy).x,norm(s.vx,s.vy).y);s.life=0;burst(s.x,s.y,'#ffb36b',10,90);break}}}
    else if(len(h.x-s.x,h.y-s.y)<h.r+s.r){hurtHero(1,s.vx,s.vy);s.life=0}
  }
  shots=shots.filter(s=>s.life>0);

  // butin
  const magnet=70;
  for(const l of cur.loot){
    l.t+=dt;
    if(!l.still){l.x+=l.vx*dt;l.y+=l.vy*dt;l.vx*=Math.pow(.02,dt);l.vy*=Math.pow(.02,dt);if(hits(l.x,l.y,4,false)){l.vx*=-.5;l.vy*=-.5}}
    const d=len(h.x-l.x,h.y-l.y);
    if(l.t>.35&&d<magnet&&l.kind!=='oeuf'){const n=norm(h.x-l.x,h.y-l.y);l.x+=n.x*260*dt;l.y+=n.y*260*dt}
    if(l.t>.3&&d<h.r+8){l.got=true;collect(l)}
  }
  cur.loot=cur.loot.filter(l=>!l.got);

  // coffre
  const c=cur.chestObj;
  if(c&&!c.open&&len(h.x-c.x,h.y-c.y)<26){c.open=true;SFX.coin();burst(c.x,c.y,'#ffd86b',18,130);drop(c.x,c.y,'eclat',ri(4,7));drop(c.x,c.y,'fibre',ri(2,4));if(Math.random()<.4)drop(c.x,c.y,'coeur')}
  // portail
  if(cur.portal){cur.portal.t+=dt;if(len(h.x-cur.portal.x,h.y-cur.portal.y)<18){showPortal()}}

  // particules et textes
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.t+=dt;f.y-=24*dt}floats=floats.filter(f=>f.t<.9);
}

function damage(e,n,dx,dy){
  e.hp-=n;e.flash=.15;e.kx=dx*180;e.ky=dy*180;SFX.hit();shake=4;burst(e.x,e.y,SPECIES[e.t].col,7,80);
  if(e.hp<=0){
    if(e.aura){e.hp=0;e.stun=true;e.st='stun';SFX.stun();floatText(e.x,e.y-16,'Assommé !','#e2774a');say('Approche-toi et appuie sur ♥ pour le sauver !',3)}
    else{e.dead=true;burst(e.x,e.y,SPECIES[e.t].col,14,120,.6);drop(e.x,e.y,'fibre',ri(1,2));if(Math.random()<.6)drop(e.x,e.y,'eclat',ri(1,2));if(Math.random()<.12)drop(e.x,e.y,'coeur')}
  }
}
function capture(e){
  e.dead=true;SFX.capture();burst(e.x,e.y,'#ffd86b',22,140,.8);burst(e.x,e.y,'#ffffff',10,90,.6);
  run.trognons.push(e.t);floatText(e.x,e.y-16,'Trognon sauvé !','#e2774a');say(SPECIES[e.t].nom+' rejoindra ton refuge.',2.5);
}
function hurtHero(n,dx,dy){
  const h=hero;if(h.inv>0||h.roll>0)return;
  h.hp-=n;h.inv=1;const d=norm(dx,dy);h.kx=d.x*260;h.ky=d.y*260;SFX.hurt();shake=7;burst(h.x,h.y,'#e2574a',10,100);
  if(h.hp<=0)ko();
}

function updEnemy(e,dt){
  const h=hero,s=SPECIES[e.t];
  e.flash=Math.max(0,e.flash-dt);e.ph+=dt;e.sq=Math.max(0,e.sq-dt*3);
  e.kx*=Math.pow(.002,dt);e.ky*=Math.pow(.002,dt);
  if(e.stun){e.stunT+=dt;moveBody(e,e.kx*dt,e.ky*dt,false);return}
  const toH=norm(h.x-e.x,h.y-e.y),dH=len(h.x-e.x,h.y-e.y);
  let vx=0,vy=0;e.tm-=dt;
  if(e.t==='glouton'){
    if(e.st==='idle'){if(e.tm<=0){e.st='hop';e.tm=.38;e.dx=toH.x+rnd(-.35,.35);e.dy=toH.y+rnd(-.35,.35);e.sq=1}}
    else{vx=e.dx*150;vy=e.dy*150;if(e.tm<=0){e.st='idle';e.tm=rnd(.5,1.1)}}
  }else if(e.t==='epineux'){
    if(e.tm<=0){e.tm=rnd(1.8,2.6);SFX.shoot();e.sq=1;shots.push({x:e.x,y:e.y,vx:toH.x*125,vy:toH.y*125,r:5,friend:false,life:3})}
    if(!e.dx||Math.random()<dt*.5){const a=Math.random()*6.283;e.dx=Math.cos(a);e.dy=Math.sin(a)}vx=e.dx*22;vy=e.dy*22;
  }else if(e.t==='bourdon'){
    if(e.st==='idle'){
      if(!e.dx||Math.random()<dt*.8){const a=Math.random()*6.283;e.dx=Math.cos(a);e.dy=Math.sin(a)}vx=e.dx*55;vy=e.dy*55;
      if(e.tm<=0&&dH<170){e.st='aim';e.tm=.55;e.dx=toH.x;e.dy=toH.y}
    }else if(e.st==='aim'){if(e.tm<=0){e.st='dash';e.tm=.45}}
    else if(e.st==='dash'){vx=e.dx*245;vy=e.dy*245;if(e.tm<=0){e.st='idle';e.tm=rnd(1.2,2)}}
  }
  const r=moveBody(e,(vx+e.kx)*dt,(vy+e.ky)*dt,false);
  if(r.bx)e.dx=-e.dx;if(r.by)e.dy=-e.dy;
  // contact
  if(dH<e.r+h.r-2)hurtHero(1,-toH.x,-toH.y);
  // les ennemis ne se superposent pas trop
  for(const o of cur.enemies){if(o===e||o.dead)continue;const d=len(o.x-e.x,o.y-e.y);if(d<e.r+o.r&&d>0){const n=norm(e.x-o.x,e.y-o.y);moveBody(e,n.x*30*dt,n.y*30*dt,false)}}
}

/* ---------- dessin ---------- */
function circle(x,y,r,f){cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fillStyle=f;cx.fill()}
function eyes(x,y,fx,fy,sp=4,r=2.2){const ex=fx*2,ey=fy*2;circle(x-sp+ex,y+ey,r,'#2d2420');circle(x+sp+ex,y+ey,r,'#2d2420');circle(x-sp+ex+.7,y+ey-.7,.8,'#fff');circle(x+sp+ex+.7,y+ey-.7,.8,'#fff')}
function shadow(x,y,r){cx.beginPath();cx.ellipse(x,y+r*.85,r*.9,r*.35,0,0,6.283);cx.fillStyle='rgba(60,45,30,.18)';cx.fill()}
function rr(x,y,w,h,r,f){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);cx.fillStyle=f;cx.fill()}

function drawRoom(){
  const g=cur.grid;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const px=x*T,py=y*T,v=g[y][x];
    if(v===1){
      let door=null;
      if(x===5&&y===0&&cur.doors.n)door='n';if(x===5&&y===ROWS-1&&cur.doors.s)door='s';
      if(y===5&&x===0&&cur.doors.w)door='w';if(y===5&&x===COLS-1&&cur.doors.e)door='e';
      if(door){rr(px,py,T,T,0,cur.cleared?'#cbb48c':'#6f5a43');
        if(!cur.cleared){cx.fillStyle='#a8875e';for(let i=0;i<3;i++){if(door==='n'||door==='s')cx.fillRect(px+5+i*9,py+2,4,T-4);else cx.fillRect(px+2,py+5+i*9,T-4,4)}}
        continue}
      rr(px,py,T,T,0,'#5f8752');rr(px+2,py+2,T-4,T-8,6,'#76a265');circle(px+9,py+9,3,'#8fbb7b');
    }else{
      cx.fillStyle=(x+y)%2?'#e9dcb8':'#e2d4ae';cx.fillRect(px,py,T,T);
      if(v===2){shadow(px+16,py+18,12);rr(px+3,py+4,T-6,T-8,9,'#a58f78');rr(px+6,py+6,T-14,8,4,'#bfaa91')}
    }
  }
  for(const [fy,fx,c] of cur.flowers){if(g[fy][fx]!==0)continue;const px=fx*T+8+c*16,py=fy*T+8+((c*7)%1)*16;circle(px,py,2.2,c<.5?'#f4a6b8':'#fff6c8');circle(px,py,1,'#e8b84a')}
}
function drawHero(){
  const h=hero;if(h.inv>0&&Math.floor(h.inv*14)%2===0&&state==='play')return;
  const bob=Math.sin(h.walk)*1.6,sq=h.roll>0?.75:1;
  shadow(h.x,h.y,h.r);
  cx.save();cx.translate(h.x,h.y+bob*.5);if(h.roll>0)cx.rotate((1-h.roll/.26)*6.283*(h.fx<0?-1:1));cx.scale(1/sq*.95+.05,sq);
  circle(0,2,h.r,'#ffd3a1');circle(0,-3,h.r-1,'#ffe2bd');
  cx.fillStyle='#7fae6a';cx.beginPath();cx.ellipse(-3,-h.r-3,5,2.6,-.6,0,6.283);cx.fill();cx.beginPath();cx.ellipse(3,-h.r-4,4,2.2,.6,0,6.283);cx.fill();
  rr(-h.r+1,3,2*h.r-2,4,2,'#e2774a');
  if(h.fy>-.6)eyes(0,-3,h.fx,h.fy,3.6,2);
  cx.restore();
  if(h.atk>0){
    const a=Math.atan2(h.fy,h.fx),p=1-h.atk/.24;
    cx.save();cx.translate(h.x,h.y);cx.rotate(a-1.2+p*2.4);
    rr(10,-2,18,4,2,'#f4f1ea');rr(7,-4,4,8,2,'#a87a4a');cx.restore();
    cx.beginPath();cx.arc(h.x,h.y,24,a-1.2,a-1.2+p*2.4);cx.strokeStyle='rgba(255,255,255,.75)';cx.lineWidth=5;cx.stroke();
  }
}
function drawBuddy(){
  const b=buddy,y=b.y+Math.sin(b.bob)*2.5,s=1+b.squash*.35;
  shadow(b.x,b.y+3,7);
  cx.save();cx.translate(b.x,y);cx.scale(s,1/s);
  cx.fillStyle='#ffb36b';cx.beginPath();cx.moveTo(0,-14);cx.quadraticCurveTo(8,-6,8,1);cx.arc(0,1,8,0,Math.PI);cx.quadraticCurveTo(-8,-6,0,-14);cx.fill();
  circle(0,2,5.5,'#ffd59a');eyes(0,0,hero.fx,hero.fy,3,1.6);cx.restore();
}
function drawEnemy(e){
  const s=SPECIES[e.t];let x=e.x,y=e.y;
  if(e.st==='aim')x+=Math.sin(e.ph*60)*1.5;
  shadow(x,y,e.r);
  if(e.aura&&!e.dead){const p=.5+.5*Math.sin(e.ph*5);cx.beginPath();cx.arc(x,y,e.r+5+p*3,0,6.283);cx.strokeStyle=`rgba(255,200,60,${.45+p*.4})`;cx.lineWidth=3;cx.stroke()}
  cx.save();cx.translate(x,y);
  const sq=e.sq*.25;cx.scale(1+sq,1-sq);
  const col=e.flash>0?'#ffffff':e.stun?'#cfc6bd':s.col,dk=e.stun?'#a39990':s.dark;
  const toH=norm(hero.x-x,hero.y-y);
  if(e.t==='glouton'){
    const hop=e.st==='hop'?-6*Math.sin((1-e.tm/.38)*Math.PI):0;cx.translate(0,hop);
    cx.beginPath();cx.ellipse(0,2,e.r+1,e.r-1,0,0,6.283);cx.fillStyle=dk;cx.fill();
    cx.beginPath();cx.ellipse(0,0,e.r,e.r-2,0,0,6.283);cx.fillStyle=col;cx.fill();
    if(!e.stun){eyes(0,-2,toH.x,toH.y,4,2.3);rr(-3,4,6,2,1,dk)}
  }else if(e.t==='epineux'){
    cx.fillStyle=dk;for(let i=0;i<8;i++){const a=i/8*6.283+e.ph*.4;cx.beginPath();cx.moveTo(Math.cos(a)*(e.r+5),Math.sin(a)*(e.r+5));cx.lineTo(Math.cos(a+.3)*e.r*.8,Math.sin(a+.3)*e.r*.8);cx.lineTo(Math.cos(a-.3)*e.r*.8,Math.sin(a-.3)*e.r*.8);cx.fill()}
    circle(0,0,e.r,col);circle(0,-e.r+1,3,'#f4a6b8');if(!e.stun)eyes(0,0,toH.x,toH.y,3.5,2.1);
  }else{
    const w=Math.sin(e.ph*40)*3;cx.fillStyle='rgba(255,255,255,.75)';cx.beginPath();cx.ellipse(-6,-7+w*.3,5,3+w*.3,-.5,0,6.283);cx.fill();cx.beginPath();cx.ellipse(6,-7+w*.3,5,3+w*.3,.5,0,6.283);cx.fill();
    circle(0,0,e.r,col);cx.fillStyle=dk;cx.fillRect(-e.r+2,1,2*e.r-4,2.5);cx.fillRect(-e.r+3,5,2*e.r-6,2);
    if(!e.stun)eyes(0,-3,toH.x,toH.y,3.2,1.9);
    if(e.st==='aim'){cx.fillStyle='#e2574a';cx.font='bold 14px sans-serif';cx.textAlign='center';cx.fillText('!',0,-e.r-6)}
  }
  if(e.stun){cx.strokeStyle='#4a3b2c';cx.lineWidth=1.6;for(const sx of[-4,4]){cx.beginPath();cx.moveTo(sx-2,-4);cx.lineTo(sx+2,0);cx.moveTo(sx+2,-4);cx.lineTo(sx-2,0);cx.stroke()}
    for(let i=0;i<3;i++){const a=e.stunT*3+i*2.094;cx.fillStyle='#ffd24d';cx.font='10px sans-serif';cx.textAlign='center';cx.fillText('★',Math.cos(a)*12,-e.r-6+Math.sin(a)*3)}}
  cx.restore();
  if(e.stun&&len(hero.x-e.x,hero.y-e.y)<34){cx.fillStyle='#e2774a';cx.font='bold 12px sans-serif';cx.textAlign='center';cx.fillText('♥ Sauver',e.x,e.y+e.r+14)}
}
function drawLoot(l){
  const b=Math.sin(l.t*6)*2;
  if(l.kind==='fibre'){shadow(l.x,l.y,4);cx.fillStyle='#6fae55';cx.beginPath();cx.ellipse(l.x,l.y-3+b,3.5,6,.5,0,6.283);cx.fill()}
  else if(l.kind==='eclat'){shadow(l.x,l.y,4);cx.fillStyle='#ffd24d';cx.beginPath();cx.moveTo(l.x,l.y-9+b);cx.lineTo(l.x+5,l.y-3+b);cx.lineTo(l.x,l.y+3+b);cx.lineTo(l.x-5,l.y-3+b);cx.fill()}
  else if(l.kind==='coeur'){cx.fillStyle='#e2574a';cx.font='15px sans-serif';cx.textAlign='center';cx.fillText('♥',l.x,l.y+b)}
  else if(l.kind==='oeuf'){rr(l.x-12,l.y+6,24,8,3,'#a58f78');shadow(l.x,l.y,8);cx.beginPath();cx.ellipse(l.x,l.y-2+b*.5,8,10,0,0,6.283);cx.fillStyle='#fff3d6';cx.fill();circle(l.x-3,l.y-4+b*.5,2,'#7fc0e6');circle(l.x+3,l.y+2+b*.5,1.6,'#f4a6b8')}
}
function drawWorld(){
  cx.save();cx.translate(OX+(Math.random()-.5)*shake,OY+(Math.random()-.5)*shake);
  cx.save();cx.beginPath();cx.rect(0,0,COLS*T,ROWS*T);cx.clip();
  drawRoom();
  const c=cur.chestObj;if(c){shadow(c.x,c.y,12);rr(c.x-12,c.y-8,24,18,4,c.open?'#8a6440':'#b0814f');rr(c.x-12,c.y-10,24,7,3,c.open?'#6e4f33':'#c99a62');circle(c.x,c.y-2,2.5,'#ffd24d')}
  if(cur.portal){const p=cur.portal;for(let i=3;i>0;i--){cx.beginPath();cx.ellipse(p.x,p.y,10+i*5+Math.sin(p.t*4+i)*2,6+i*3,0,0,6.283);cx.fillStyle=`rgba(150,120,230,${.18+.1*i})`;cx.fill()}cx.fillStyle='#4a3b2c';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText('Sortie',p.x,p.y-24)}
  for(const l of cur.loot)drawLoot(l);
  const ents=[...cur.enemies.filter(e=>!e.dead).map(e=>({y:e.y,f:()=>drawEnemy(e)})),{y:hero.y,f:drawHero},{y:buddy.y,f:drawBuddy}];
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  for(const s of shots){if(s.friend){circle(s.x,s.y,s.r+3,'rgba(255,160,80,.35)');circle(s.x,s.y,s.r,'#ffb36b');circle(s.x,s.y,s.r-3,'#fff0c2')}else{circle(s.x,s.y,s.r,'#5f9a4a');circle(s.x-1,s.y-1,2,'#a9d98f')}}
  for(const p of parts){cx.globalAlpha=Math.max(0,p.life/p.max);circle(p.x,p.y,p.r,p.col)}cx.globalAlpha=1;
  for(const f of floats){cx.globalAlpha=1-f.t/.9;cx.fillStyle=f.col;cx.font='bold 12px sans-serif';cx.textAlign='center';cx.fillText(f.txt,f.x,f.y)}cx.globalAlpha=1;
  cx.restore();
  if(fade>0){cx.fillStyle=`rgba(243,230,208,${fade/.25})`;cx.fillRect(0,0,COLS*T,ROWS*T)}
  cx.restore();
}
function drawHud(){
  // cœurs
  for(let i=0;i<hero.max/2;i++){const v=hero.hp-i*2,x=18+i*24,y=26;cx.font='22px sans-serif';cx.textAlign='center';cx.fillStyle='#d9c19c';cx.fillText('♥',x,y);
    if(v>=2){cx.fillStyle='#e2574a';cx.fillText('♥',x,y)}else if(v===1){cx.save();cx.beginPath();cx.rect(x-12,0,12,40);cx.clip();cx.fillStyle='#e2574a';cx.fillText('♥',x,y);cx.restore()}}
  cx.font='bold 13px sans-serif';cx.textAlign='left';cx.fillStyle='#4a3b2c';
  cx.fillText(`🌿${run.fibres}  💎${run.eclats}  🥚${run.oeufs}  ♥${run.trognons.length}`,8,52);
  cx.textAlign='right';cx.fillText('Étage '+floorN,COLS*T+OX-62,22);

  const mx=W-60,my=6,s=10;
  for(const k in rooms){const r=rooms[k];if(!r.seen&&!Object.values(r.doors).some(d=>rooms[d].seen))continue;

    if(r.exit&&r.seen){circle(mx+r.gx*s+s/2,my+r.gy*s+s/2,2,'#8f74d9')}}

function drawControls(){
  rr(0,CTRL_Y,W,H-CTRL_Y,0,'#ead7b8');
  cx.fillStyle='#d9c19c';cx.fillRect(0,CTRL_Y,W,3);
  // joystick
  const bx=joy.id!==null?joy.bx:86,by=joy.id!==null?joy.by:CTRL_Y+108;
  circle(bx,by,44,'rgba(160,130,95,.25)');
  let kx=bx,ky=by;if(joy.id!==null){const dx=joy.x-bx,dy=joy.y-by,l=len(dx,dy),m=Math.min(l,40);if(l>0){kx=bx+dx/l*m;ky=by+dy/l*m}}
  circle(kx,ky,20,'#c9a97c');circle(kx,ky-2,18,'#dcc09a');
  // boutons
  const draw=(b,col,dk,txt,cd)=>{
    circle(b.x,b.y+4,b.r,dk);circle(b.x,b.y,b.r,col);
    if(cd>0){cx.beginPath();cx.moveTo(b.x,b.y);cx.arc(b.x,b.y,b.r,-Math.PI/2,-Math.PI/2+6.283*cd);cx.fillStyle='rgba(74,59,44,.35)';cx.fill()}
    cx.fillStyle='#fff';cx.font=`bold ${Math.round(b.r*.8)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(txt,b.x,b.y+1);cx.textBaseline='alphabetic';
  };
  draw(BTN.atk,BTN.atk.label==='♥'?'#e2574a':'#e2774a',BTN.atk.label==='♥'?'#b03b31':'#b55a35',BTN.atk.label,0);
  draw(BTN.pow,'#ff9f5a','#c46e33','✦',buddy?buddy.cd/3.5:0);
  draw(BTN.roll,'#7fae6a','#5a8a48','↻',hero?hero.rollCd/.75:0);
  cx.fillStyle='#8a7258';cx.font='11px sans-serif';cx.textAlign='center';
  cx.fillText('Souffle',BTN.pow.x,BTN.pow.y-BTN.pow.r-6);cx.fillText('Roulade',BTN.roll.x,BTN.roll.y+BTN.roll.r+16);
}
function drawBanner(){
  if(banner){const a=Math.min(1,banner.d*2);cx.globalAlpha=a;rr(40,OY+130,280,44,14,'rgba(255,248,236,.95)');cx.fillStyle='#e2774a';cx.font='bold 18px sans-serif';cx.textAlign='center';cx.fillText(banner.t,180,OY+158);cx.globalAlpha=1}
  if(msg){const a=Math.min(1,msg.d*2);cx.globalAlpha=a;cx.font='bold 13px sans-serif';const w=Math.min(340,cx.measureText(msg.t).width+24);rr(180-w/2,OY+ROWS*T-38,w,28,10,'rgba(74,59,44,.85)');cx.fillStyle='#fff';cx.textAlign='center';cx.fillText(msg.t,180,OY+ROWS*T-19);cx.globalAlpha=1}
}
function render(){
  cx.fillStyle='#f3e6d0';cx.fillRect(-offX/scale,-offY/scale,W+2*offX/scale,H+2*offY/scale);
  if(cur){drawWorld();drawHud();drawBanner()}
  drawControls();
}
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}
// accès pour les tests automatiques
window.__g={get hero(){return hero},get cur(){return cur},get rooms(){return rooms},get state(){return state},get run(){return run},input,startRun,damage,capture};
showTitle();requestAnimationFrame(loop);
</script>
